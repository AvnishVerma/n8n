services:
  - type: web
    name: n8n-bot
    env: docker
    plan: free
    dockerfilePath: ./docker/images
    envVars:
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: "admin"
      - key: N8N_BASIC_AUTH_PASSWORD
        value: "yourpassword"
      - key: WEBHOOK_URL
        value: "https://n8n-bot.onrender.com/"
      - key: EXECUTIONS_PROCESS
        value: "main"
      - key: OPENAI_API_KEY
        sync: false   # set this in dashboard
      - key: WHATSAPP_TOKEN
        sync: false   # set this in dashboard
      - key: WHATSAPP_PHONE_ID
        sync: false   # set this in dashboard
